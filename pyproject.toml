[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convexpm"
version = "0.1.0"
description = "A simple, extensible portfolio management and analysis toolkit."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ConvexPM Contributors" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["convexpm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
